# Optional virtual X11 display for native UI tests in the cloud.
Section "Device"
 Identifier "DummyVideo"
 Driver "dummy"
 VideoRam 256000
EndSection
Section "Monitor"
 Identifier "DummyMonitor"
 HorizSync 28.0-80.0
 VertRefresh 48.0-75.0
 Modeline "1440x900" 106.5 1440 1520 1672 1904 900 903 909 934 -HSync +Vsync
EndSection
Section "Screen"
 Identifier "DummyScreen"
 Device "DummyVideo"
 Monitor "DummyMonitor"
 DefaultDepth 24
 SubSection "Display"
  Depth 24
  Modes "1440x900"
 EndSubSection
EndSection
